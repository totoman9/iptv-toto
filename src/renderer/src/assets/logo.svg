<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- IPTV Toto: yüzeyleri gölgelendirilmiş (3B) bir "T" — aynı zamanda bir
       yayın anteni: gövde direk, üst çubuk anten kolu, tepede yayın dalgaları. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1430" />
      <stop offset="1" stop-color="#07060c" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#e879f9" />
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e7e1fb" />
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc6f2" />
      <stop offset="1" stop-color="#a99ce0" />
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a67c4" />
      <stop offset="1" stop-color="#4c3c93" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)" />
  <rect width="1024" height="1024" rx="228" fill="url(#glow)" />
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="4" />

  <g transform="translate(-26 24)">
  <!-- Yayın dalgaları (antenin tepesinden iki yana) -->
  <g fill="none" stroke="url(#wave)" stroke-linecap="round" transform="translate(0 -40)">
    <path d="M 412 318 A 120 120 0 0 1 412 150" stroke-width="26" opacity="0.95" />
    <path d="M 352 360 A 190 190 0 0 1 352 108" stroke-width="26" opacity="0.6" />
    <path d="M 652 318 A 120 120 0 0 0 652 150" stroke-width="26" opacity="0.95" />
    <path d="M 712 360 A 190 190 0 0 0 712 108" stroke-width="26" opacity="0.6" />
  </g>

  <!-- Anten tepesi -->
  <circle cx="532" cy="194" r="46" fill="#f5f3ff" />
  <circle cx="532" cy="194" r="46" fill="url(#glow)" />
  <path d="M 510 222 L 554 222 L 562 372 L 502 372 Z" fill="url(#front)" />

  <!-- Gövde (direk) -->
  <polygon points="552,470 604,430 604,812 552,852" fill="url(#side)" />
  <polygon points="460,470 552,470 552,852 460,852" fill="url(#front)" />

  <!-- Üst çubuk (anten kolu) -->
  <polygon points="262,390 314,350 814,350 762,390" fill="url(#top)" />
  <polygon points="762,390 814,350 814,432 762,472" fill="url(#side)" />
  <polygon points="262,390 762,390 762,472 262,472" fill="url(#front)" />

  <!-- Kenar vurguları -->
  <path d="M 262 390 L 762 390 M 460 472 L 460 852" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" />
  </g>
</svg>

<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="944" y2="964" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="32" x2="512" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="letter" x1="512" y1="230" x2="512" y2="794" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#5b21b6" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#bg)" filter="url(#soft)"/>
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#sheen)"/>

  <!-- Modern "T" monogram: kalın, geometrik. Üst çubuğun sağ ucu bir
       "canlı yayın" sinyali/oynat okuna dönüşüyor. -->
  <g>
    <rect x="256" y="256" width="512" height="108" rx="54" fill="url(#letter)"/>
    <rect x="458" y="256" width="108" height="512" rx="54" fill="url(#letter)"/>
    <circle cx="722" cy="310" r="46" fill="#f5d0fe"/>
    <circle cx="722" cy="310" r="46" fill="#ffffff" fill-opacity="0.55"/>
  </g>
</svg>
